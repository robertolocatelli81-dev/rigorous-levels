name: ci
on:
  push:
    branches: [main, dev-0.3]
  pull_request:
permissions:
  contents: read
env:
  PIP_NO_CACHE_DIR: "1"
  OMP_NUM_THREADS: "1"
jobs:
  # ── Linux x86-64: every Python, bwrap + podman + docker engines, stack 8 MiB (default), unlimited and 1 MiB ──
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        stack: ["default"]
        include:
          - {python: "3.14", stack: "unlimited"}
          - {python: "3.14", stack: "1024"}
          - {python: "3.11", stack: "unlimited"}
          - {python: "3.11", stack: "1024"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap and podman, allow unprivileged user namespaces (Ubuntu 24.04 restricts them through AppArmor); the job fails if bwrap cannot start
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y bubblewrap podman
          bwrap --version; podman --version; docker --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc true
      - name: Pull the container image of this Python once (the package itself never pulls)
        run: |
          IMG="docker.io/library/python:${{ matrix.python }}-slim"
          podman pull "$IMG" && podman image inspect "$IMG" >/dev/null
          docker pull "$IMG" && docker image inspect "$IMG" >/dev/null
      - name: Install
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install --no-deps .
      - name: Install gitleaks 8.30.1 (sha256 checked)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: File list, imports, deny-list, secrets
        run: |
          python check_tree.py
          python check_tree.py --positive-control
      - name: Tests against the installed package, stack ${{ matrix.stack }}; the sandbox tests must run for bwrap, podman and docker (not be skipped)
        run: |
          case "${{ matrix.stack }}" in default) ;; unlimited) ulimit -s unlimited ;; *) ulimit -s ${{ matrix.stack }} ;; esac
          ulimit -s
          cd tests
          python -c 'import rigorous_levels; assert "site-packages" in rigorous_levels.__file__, rigorous_levels.__file__; print(rigorous_levels.__file__)'
          python -B -m unittest -v test_guaranteed_intervals test_rotor_spectrum test_scqubits_adapter test_readme_example test_spherical_rotor test_hyperfine_molecule test_inputs_review test_duffing_vs_transmon test_multiport test_port_centrex_tlf test_mathieu test_fluxonium test_parameter_balls test_matrix_elements test_cos4phi_origin test_examples test_generative_inputs test_deprecated_aliases test_spec_bounds test_determinism 2>&1 | tee ../unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          for e in bwrap podman docker; do grep -qE "^test_s1_rete_bloccata \\(test_multiport\\.TestSandbox_$e(\\.test_s1_rete_bloccata)?\\) \\.\\.\\. ok" ../unittest.log || { echo "engine $e: the S1 test did not run"; exit 1; }; done
      - name: Deprecated Italian aliases are the only source of DeprecationWarning (the English API is warning-free)
        run: |
          cd tests
          python -W error::DeprecationWarning -B -m unittest test_guaranteed_intervals test_rotor_spectrum test_mathieu
      - name: Re-measure the README claims offline (fast set), the sabotage positive control, the determinism hash, and unittest discover
        run: |
          python -m rigorous_levels.reproduce
          python -m rigorous_levels.reproduce --sabotage
          echo "determinism hash: $(python -m rigorous_levels.reproduce --hash) (python ${{ matrix.python }}, stack ${{ matrix.stack }})"
          python -B -m unittest discover -s tests -t tests -p "test_*.py" > "$RUNNER_TEMP/discover.log" 2>&1 || { tail -40 "$RUNNER_TEMP/discover.log"; exit 1; }
          echo "unittest discover: OK"

  # ── Linux ARM64: bwrap + docker (podman is installed too), Python 3.12 and 3.14 ──
  linux-arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: bubblewrap, podman, user namespaces, container image
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y bubblewrap podman
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc true
          IMG="docker.io/library/python:${{ matrix.python }}-slim"
          docker pull "$IMG"; podman pull "$IMG"
      - name: Install and test (sandbox tests must run for bwrap and docker)
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install --no-deps .
          cd tests
          python -B -m unittest -v test_guaranteed_intervals test_rotor_spectrum test_spherical_rotor test_hyperfine_molecule test_multiport test_mathieu test_fluxonium test_parameter_balls test_matrix_elements test_cos4phi_origin test_generative_inputs test_spec_bounds test_determinism 2>&1 | tee ../unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          for e in bwrap docker; do grep -qE "^test_s1_rete_bloccata \\(test_multiport\\.TestSandbox_$e(\\.test_s1_rete_bloccata)?\\) \\.\\.\\. ok" ../unittest.log || { echo "engine $e: the S1 test did not run"; exit 1; }; done
          cd .. && python -m rigorous_levels.reproduce && echo "determinism hash: $(python -m rigorous_levels.reproduce --hash) (linux-arm, python ${{ matrix.python }})"

  # ── macOS (ARM64 runner): everything that is not a sandbox, plus the sandbox-exec engine (S1–S7) ──
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: State of sandbox-exec on this macOS (the man page marks it DEPRECATED; measured here, not assumed)
        run: |
          sw_vers; uname -m
          which sandbox-exec
          man -w sandbox-exec || true
          sandbox-exec -p '(version 1)(deny default)(allow process-exec (literal "/usr/bin/true"))(allow file-read*)' /usr/bin/true && echo "sandbox-exec runs a deny-default profile"
      - name: Which rlimits macOS applies (measured here, not assumed; the memory cap of sandbox-exec is the host watchdog)
        run: |
          for n in RLIMIT_AS RLIMIT_DATA RLIMIT_RSS RLIMIT_FSIZE RLIMIT_CPU RLIMIT_NPROC; do
            python - "$n" <<'PY'
          import resource, sys
          n = sys.argv[1]
          w = getattr(resource, n, None)
          v = {"RLIMIT_FSIZE": 64 << 20, "RLIMIT_CPU": 10, "RLIMIT_NPROC": 16}.get(n, 256 << 20)
          line = f"{n}: getrlimit {resource.getrlimit(w) if w is not None else 'absent'}"
          try:
              resource.setrlimit(w, (v, v))
              line += f"; setrlimit({v}) accepted"
              if v == 256 << 20:
                  try:
                      a = bytearray(3000 << 20); a[::65536] = b"1" * len(a[::65536])
                      line += "; 3000 MiB allocated and touched: NOT enforced"
                  except MemoryError:
                      line += "; 3000 MiB: MemoryError (enforced)"
          except (ValueError, OSError, TypeError) as e:
              line += f"; setrlimit refused: {type(e).__name__}: {e}"
          print(line)
          PY
          done
      - name: Install and test (the sandbox-exec S1 test must run)
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install --no-deps .
          cd tests
          python -B -m unittest -v test_guaranteed_intervals test_rotor_spectrum test_scqubits_adapter test_spherical_rotor test_hyperfine_molecule test_duffing_vs_transmon test_multiport test_mathieu test_fluxonium test_parameter_balls test_matrix_elements test_cos4phi_origin test_examples test_generative_inputs test_deprecated_aliases test_spec_bounds test_determinism 2>&1 | tee ../unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -qE "^test_s1_rete_bloccata \\(test_multiport\\.TestSandbox_sandbox_exec(\\.test_s1_rete_bloccata)?\\) \\.\\.\\. ok" ../unittest.log || { echo "sandbox-exec: the S1 test did not run"; exit 1; }
          cd .. && python -m rigorous_levels.reproduce && echo "determinism hash: $(python -m rigorous_levels.reproduce --hash) (macos, python ${{ matrix.python }})"

  # ── Windows: everything that is not a sandbox, plus the AppContainer + Job Object engine (S1–S7) ──
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: What an AppContainer process can open (NUL device) and where its own folder is (measured, not assumed)
        shell: bash
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install --no-deps .
          python - <<'PY'
          import os, subprocess, sys, tempfile
          from rigorous_levels import isolation as I
          ctypes, wt = I._win()
          sid, s = I._appcontainer_sid(ctypes, wt, "rigorous-levels-multiport")
          d = tempfile.mkdtemp(prefix="rigorous_levels_measure_")
          I._icacls(d, s, "M")
          for p in (sys.base_prefix, sys.prefix):
              I._icacls(p, s, "RX")
          probe, out = os.path.join(d, "p.py"), os.path.join(d, "o.txt")
          with open(probe, "w") as f:
              f.write("import os, sys, tempfile\nr = []\nfor m in ('rb', 'wb', 'r+b'):\n    try:\n        open('nul', m).close(); r.append(m + ' ok')\n"
                      "    except OSError as e:\n        r.append(f'{m} {type(e).__name__} {e.errno}')\n"
                      "r += [f'{k}={os.environ.get(k)!r} exists={os.path.isdir(os.environ.get(k, chr(1)))}' for k in ('TEMP', 'TMP', 'LOCALAPPDATA', 'USERPROFILE')]\n"
                      "r.append(f'cwd={os.getcwd()!r} gettempdir={tempfile.gettempdir()!r}')\n"
                      "open(sys.argv[1], 'w').write('; '.join(r))\n")
          print("TEMP passed to the AppContainer:", d)
          env = {**I._appcontainer_base_env(d), "TEMP": d, "TMP": d}
          cmd = subprocess.list2cmdline([sys.executable, "-I", "-S", "-B", probe, out])
          try:
              print("exit:", I._run_appcontainer_process(ctypes, wt, sid, cmd, env, d, 60, 1024, os.path.join(d, "e.txt")))
              print("open('nul') inside the AppContainer:", open(out).read() if os.path.exists(out) else open(os.path.join(d, "e.txt")).read())
          except Exception as e:
              print("NUL measure failed:", type(e).__name__, e)
          try:
              print("AppContainer folder:", I._appcontainer_folder(ctypes, wt, s))
          except Exception as e:
              print("AppContainer folder not found:", type(e).__name__, e)
          PY
      - name: Install and test (the appcontainer S1 test must run)
        shell: bash
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install --no-deps .
          cd tests
          python -B -m unittest -v test_guaranteed_intervals test_rotor_spectrum test_scqubits_adapter test_spherical_rotor test_hyperfine_molecule test_duffing_vs_transmon test_multiport test_mathieu test_fluxonium test_parameter_balls test_matrix_elements test_cos4phi_origin test_examples test_generative_inputs test_deprecated_aliases test_spec_bounds test_determinism 2>&1 | tee ../unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -qE "^test_s1_rete_bloccata \\(test_multiport\\.TestSandbox_appcontainer(\\.test_s1_rete_bloccata)?\\) \\.\\.\\. ok" ../unittest.log || { echo "appcontainer: the S1 test did not run"; exit 1; }
          cd .. && python -m rigorous_levels.reproduce && echo "determinism hash: $(python -m rigorous_levels.reproduce --hash) (windows, python ${{ matrix.python }})"

  # ── Free-threaded Python 3.14t: the pure-math modules (python-flint publishes cp314t wheels? measured here: the job
  #    reports which dependencies have wheels and skips the modules whose dependency is missing) ──
  free-threaded:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"
      - name: Install what has wheels (no build from source), report the rest
        run: |
          python -c 'import sys; print(sys.version, "GIL enabled:", sys._is_gil_enabled())'
          for p in numpy scipy python-flint sympy mpmath; do python -m pip install --only-binary=:all: "$p" || echo "NO WHEEL: $p"; done
          python -m pip install --no-deps .
      - name: Tests (modules whose dependency is missing are skipped with the reason)
        run: |
          cd tests
          python -B -m unittest -v test_rotor_spectrum test_guaranteed_intervals test_spherical_rotor test_mathieu test_fluxonium test_generative_inputs test_determinism 2>&1 | tee ../unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          cd .. && if python -c "import flint" 2>/dev/null; then echo "determinism hash: $(python -m rigorous_levels.reproduce --hash) (free-threaded 3.14t, python-flint $(python -c 'import flint; print(flint.__version__)'))"; else echo "determinism hash: not computed (python-flint has no wheel here)"; fi
